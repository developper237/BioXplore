<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logging Out | BioXplore</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --green: #1f3d2b;
  --neutral: #f4f4f2;
  --accent: #6fbf73;
  --green-light: #7edc88;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Inter", sans-serif;
  background: linear-gradient(135deg, #2e7d4f, #5fbf6a);
  color: #222;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}

.logout-container {
  background: white;
  border-radius: 24px;
  padding: 3rem;
  max-width: 500px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
  animation: fadeInScale 0.5s ease;
}

.logout-icon {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, #2e7d4f, #5fbf6a);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 2rem;
  color: white;
  font-size: 2.5rem;
}

.logout-container h1 {
  font-family: "Playfair Display", serif;
  font-size: 2rem;
  margin-bottom: 1rem;
  color: var(--green);
}

.logout-container p {
  color: #6b7f86;
  margin-bottom: 2rem;
  font-size: 1.05rem;
}

.logout-message {
  background: #e8f5e9;
  padding: 1rem;
  border-radius: 12px;
  margin-bottom: 2rem;
  color: #2e7d4f;
  font-weight: 600;
}

.logout-buttons {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.logout-btn {
  padding: 1rem 2rem;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.3s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
}

.btn-primary {
  background: #2e7d4f;
  color: white;
}

.btn-primary:hover {
  background: #256b41;
  transform: translateY(-2px);
}

.btn-secondary {
  background: #f0f0f0;
  color: var(--green);
}

.btn-secondary:hover {
  background: #e0e0e0;
}

.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  border-top-color: white;
  animation: spin 0.8s linear infinite;
}

@keyframes fadeInScale {
  from {
    opacity: 0;
    transform: scale(0.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 600px) {
  .logout-container {
    padding: 2rem;
  }
  
  .logout-container h1 {
    font-size: 1.6rem;
  }
}
</style>
</head>

<body>

<div class="logout-container">
  <div class="logout-icon">
    <i class="fas fa-sign-out-alt"></i>
  </div>
  
  <h1>Logging You Out...</h1>
  <p>Please wait while we securely log you out of your BioXplore account.</p>
  
  <div class="logout-message" id="logoutMessage">
    <div class="loading"></div>
    <span style="margin-left: 0.5rem;">Processing...</span>
  </div>
  
  <div class="logout-buttons" id="logoutButtons" style="display: none;">
    <a href="home.html" class="logout-btn btn-primary">
      <i class="fas fa-home"></i> Return to Home
    </a>
    <a href="login.html" class="logout-btn btn-secondary">
      <i class="fas fa-sign-in-alt"></i> Log In Again
    </a>
  </div>
</div>

<script>
const API_URL = 'http://localhost:5000';

async function performLogout() {
  const refreshToken = localStorage.getItem('refreshToken');
  const accessToken = localStorage.getItem('accessToken');

  // Call API to revoke refresh token
  if (refreshToken && accessToken) {
    try {
      await fetch(`${API_URL}/api/auth/logout`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${accessToken}`
        },
        body: JSON.stringify({ refreshToken })
      });
    } catch (e) {
      console.warn('Serveur inaccessible, session locale effacée quand même.');
    }
  }

  // Clear all session data
  localStorage.removeItem('accessToken');
  localStorage.removeItem('refreshToken');
  localStorage.removeItem('user');
  localStorage.removeItem('cartItems');
  localStorage.removeItem('userToken'); // legacy key
  sessionStorage.clear();

  document.getElementById('logoutMessage').innerHTML = '<i class="fas fa-check-circle"></i> Successfully logged out!';
  document.getElementById('logoutButtons').style.display = 'flex';

  // Auto redirect after 3 seconds
  setTimeout(() => {
    window.location.href = 'home.html';
  }, 3000);
}

performLogout();
</script>

</body>
</html>
